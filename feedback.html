<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="assets/favicon.ico" sizes="any" />
  <title>Visitor Survey - Memory Library</title>
  <meta name="description" content="Visited Memory Library at Portsmouth Historic Quarter? Tell us how it went in our short visitor survey." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/motion.css" />
</head>
<body data-page="feedback">
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="site-header"></div>

  <main id="main">

    <!-- ================= INTRO ================= -->
    <section class="section-pad-sm">
      <div class="wrap">
        <div class="grid">
          <h1 class="t-display" style="grid-column: 1 / span 9; font-size: clamp(2.25rem, 1.8rem + 3vw, 4.5rem); margin-bottom: var(--space-6);">Tell us how it went</h1>
          <p class="t-intro measure" style="grid-column: 1 / span 8;">
            Thank you for visiting Memory Library. Your answers help us understand what worked, what didn't, and how to shape what comes next.
          </p>
        </div>
      </div>
    </section>

    <!-- ================= SURVEY ================= -->
    <section class="section-pad-sm tone-paper">
      <div class="wrap grid">
        <div style="grid-column: 1 / span 8;">
          <iframe
            id="tally-survey"
            data-tally-src="https://tally.so/embed/Eq5YXr?alignLeft=1&hideTitle=1&transparentBackground=1&dynamicHeight=1"
            loading="lazy"
            width="100%"
            height="4039"
            frameborder="0"
            marginheight="0"
            marginwidth="0"
            title="Memory Library - Visitor Survey"></iframe>
          <p class="t-small" style="margin-top: var(--space-6); opacity:.6;">
            Having trouble with the form? <a class="link-underline" href="https://tally.so/r/Eq5YXr" target="_blank" rel="noopener">Open it in a new tab</a>.
          </p>
        </div>
      </div>
    </section>

  </main>

  <div id="site-footer"></div>

  <script type="module" src="js/nav.js"></script>
  <script type="module" src="js/reveal.js"></script>

  <script>var d=document,w="https://tally.so/widgets/embed.js",v=function(){"undefined"!=typeof Tally?Tally.loadEmbeds():d.querySelectorAll("iframe[data-tally-src]:not([src])").forEach((function(e){e.src=e.dataset.tallySrc}))};if("undefined"!=typeof Tally)v();else if(d.querySelector('script[src="'+w+'"]')==null){var s=d.createElement("script");s.src=w,s.onload=v,s.onerror=v,d.body.appendChild(s);}</script>

  <script src="js/analytics.js"></script>
  <script data-goatcounter="https://memorylibrary.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
</body>
</html>
